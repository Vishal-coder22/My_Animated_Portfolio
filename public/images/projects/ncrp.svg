<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <ellipse cx="500" cy="300" rx="250" ry="200" fill="#3B82F6" opacity="0.05"/>
  <!-- Browser chrome -->
  <rect x="40" y="30" width="720" height="540" rx="12" fill="#111118" stroke="#ffffff0d" stroke-width="1"/>
  <rect x="40" y="30" width="720" height="36" rx="12" fill="#16161f"/>
  <rect x="40" y="54" width="720" height="12" fill="#16161f"/>
  <circle cx="62" cy="48" r="5" fill="#ff5f57"/><circle cx="80" cy="48" r="5" fill="#febc2e"/><circle cx="98" cy="48" r="5" fill="#28c840"/>
  <rect x="200" y="41" width="400" height="14" rx="7" fill="#ffffff08"/>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui" font-size="8" fill="#ffffff40">ncrp.vercel.app</text>
  <!-- Sidebar -->
  <rect x="40" y="66" width="160" height="504" fill="#0d0b16"/>
  <rect x="40" y="66" width="160" height="1" fill="#ffffff08"/>
  <text x="65" y="92" font-family="system-ui" font-size="11" font-weight="700" fill="#3B82F6">NCRP</text>
  <text x="65" y="105" font-family="system-ui" font-size="9" fill="#ffffff40">Report Cyber-Fraud</text>
  <!-- Sidebar items -->
  <rect x="55" y="125" width="130" height="28" rx="6" fill="#3B82F6" opacity="0.12"/>
  <text x="75" y="143" font-family="system-ui" font-size="9" fill="#3B82F6">New Report</text>
  <rect x="55" y="162" width="130" height="28" rx="6" fill="transparent"/>
  <text x="75" y="180" font-family="system-ui" font-size="9" fill="#ffffff50">My Drafts</text>
  <rect x="55" y="199" width="130" height="28" rx="6" fill="transparent"/>
  <text x="75" y="217" font-family="system-ui" font-size="9" fill="#ffffff50">Status</text>
  <rect x="55" y="236" width="130" height="28" rx="6" fill="transparent"/>
  <text x="75" y="254" font-family="system-ui" font-size="9" fill="#ffffff50">1930 Helpline</text>
  <!-- Shield badge -->
  <path d="M 250 95 L 285 80 L 320 95 L 320 130 C 320 155 300 172 285 180 C 270 172 250 155 250 130 Z" fill="#3B82F615" stroke="#3B82F6" stroke-width="2"/>
  <path d="M 268 132 L 280 144 L 303 118" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="345" y="110" font-family="system-ui" font-size="13" font-weight="700" fill="#ffffff90">Victim-first reporting</text>
  <text x="345" y="132" font-family="system-ui" font-size="9" fill="#ffffff50">Auto-save draft recovery survives browser crashes</text>
  <text x="345" y="152" font-family="system-ui" font-size="9" fill="#ffffff50">67 passing Playwright tests · Chromium + mobile</text>
  <!-- Incident form -->
  <rect x="220" y="200" width="520" height="230" rx="8" fill="#16161f" stroke="#ffffff08" stroke-width="1"/>
  <text x="240" y="226" font-family="system-ui" font-size="10" font-weight="600" fill="#ffffff80">Incident details</text>
  <rect x="240" y="240" width="330" height="34" rx="6" fill="#1c1a28"/>
  <text x="256" y="261" font-family="system-ui" font-size="9" fill="#ffffff40">Describe what happened...</text>
  <rect x="585" y="240" width="135" height="34" rx="6" fill="#3B82F612"/>
  <text x="652" y="261" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B82F6">Draft saved ✓</text>
  <!-- Classification chips -->
  <text x="240" y="305" font-family="system-ui" font-size="9" font-weight="600" fill="#ffffff70">Incident classification</text>
  <rect x="240" y="315" width="150" height="30" rx="15" fill="#3B82F615"/>
  <text x="315" y="334" text-anchor="middle" font-family="system-ui" font-size="9" fill="#3B82F6">UPI Fraud · 94%</text>
  <rect x="400" y="315" width="130" height="30" rx="15" fill="#ffffff08"/>
  <text x="465" y="334" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ffffff50">Phishing · 61%</text>
  <rect x="540" y="315" width="130" height="30" rx="15" fill="#ffffff08"/>
  <text x="605" y="334" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ffffff50">Identity · 38%</text>

  <rect x="240" y="365" width="480" height="50" rx="8" fill="#3B82F610" stroke="#3B82F620" stroke-width="1"/>
  <text x="260" y="387" font-family="system-ui" font-size="10" font-weight="600" fill="#3B82F6">Emergency intervention path · 1930</text>
  <text x="260" y="404" font-family="system-ui" font-size="8" fill="#ffffff50">Escalate to the national cyber-fraud helpline with one tap</text>
  <!-- Validation row -->
  <rect x="220" y="450" width="250" height="90" rx="8" fill="#16161f" stroke="#ffffff08" stroke-width="1"/>
  <text x="240" y="478" font-family="system-ui" font-size="9" font-weight="600" fill="#ffffff70">Zod-validated forms</text>
  <text x="240" y="498" font-family="system-ui" font-size="8" fill="#3B82F6">✓ phone · ✓ amount · ✓ incident type</text>
  <text x="240" y="516" font-family="system-ui" font-size="8" fill="#ffffff40">errors surfaced inline before submit</text>
  <rect x="490" y="450" width="250" height="90" rx="8" fill="#16161f" stroke="#ffffff08" stroke-width="1"/>
  <text x="510" y="478" font-family="system-ui" font-size="9" font-weight="600" fill="#ffffff70">Built solo · Build What Moves India</text>
  <text x="510" y="498" font-family="system-ui" font-size="8" fill="#ffffff50">Next.js · TypeScript · Tailwind · Playwright</text>
  <text x="510" y="516" font-family="system-ui" font-size="8" fill="#3B82F6">deployed to Vercel</text>

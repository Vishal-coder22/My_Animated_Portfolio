<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a14"/>
      <stop offset="100%" stop-color="#100d1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <ellipse cx="500" cy="300" rx="250" ry="200" fill="#A855F7" opacity="0.05"/>
  <!-- Browser chrome -->
  <rect x="40" y="30" width="720" height="540" rx="12" fill="#111118" stroke="#ffffff0d" stroke-width="1"/>
  <rect x="40" y="30" width="720" height="36" rx="12" fill="#16161f"/>
  <rect x="40" y="54" width="720" height="12" fill="#16161f"/>
  <circle cx="62" cy="48" r="5" fill="#ff5f57"/><circle cx="80" cy="48" r="5" fill="#febc2e"/><circle cx="98" cy="48" r="5" fill="#28c840"/>
  <rect x="200" y="41" width="400" height="14" rx="7" fill="#ffffff08"/>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui" font-size="8" fill="#ffffff40">ai-report-agent.app</text>
  <!-- Sidebar -->
  <rect x="40" y="66" width="160" height="504" fill="#0d0b16"/>
  <rect x="40" y="66" width="160" height="1" fill="#ffffff08"/>
  <text x="65" y="92" font-family="system-ui" font-size="11" font-weight="700" fill="#A855F7">AI Report</text>
  <text x="65" y="105" font-family="system-ui" font-size="9" fill="#ffffff40">Agent</text>
  <!-- Sidebar items -->
  <rect x="55" y="125" width="130" height="28" rx="6" fill="#A855F7" opacity="0.12"/>
  <text x="75" y="143" font-family="system-ui" font-size="9" fill="#A855F7">Dashboard</text>
  <rect x="55" y="162" width="130" height="28" rx="6" fill="transparent"/>
  <text x="75" y="180" font-family="system-ui" font-size="9" fill="#ffffff50">Documents</text>
  <rect x="55" y="199" width="130" height="28" rx="6" fill="transparent"/>
  <text x="75" y="217" font-family="system-ui" font-size="9" fill="#ffffff50">Analysis</text>
  <rect x="55" y="236" width="130" height="28" rx="6" fill="transparent"/>
  <text x="75" y="254" font-family="system-ui" font-size="9" fill="#ffffff50">History</text>
  <!-- Upload zone -->
  <rect x="220" y="80" width="520" height="100" rx="8" fill="#A855F7" opacity="0.04" stroke="#A855F720" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="480" y="125" text-anchor="middle" font-family="system-ui" font-size="11" fill="#ffffff60">Drop PDF here or click to upload</text>
  <text x="480" y="145" text-anchor="middle" font-family="system-ui" font-size="9" fill="#ffffff30">Supports PDF, DOCX, TXT</text>
  <!-- Chat/analysis panel -->
  <rect x="220" y="200" width="520" height="340" rx="8" fill="#16161f" stroke="#ffffff08" stroke-width="1"/>
  <text x="240" y="225" font-family="system-ui" font-size="10" font-weight="600" fill="#ffffff80">Analysis</text>
  <!-- Chat bubbles -->
  <rect x="240" y="245" width="380" height="40" rx="8" fill="#1c1a28"/>
  <text x="260" y="265" font-family="system-ui" font-size="9" fill="#ffffff60">Uploaded: Medical_Report_2024.pdf</text>
  <text x="260" y="278" font-family="system-ui" font-size="8" fill="#ffffff30">2.4 MB • 12 pages</text>
  <rect x="240" y="300" width="440" height="50" rx="8" fill="#A855F710"/>
  <text x="260" y="320" font-family="system-ui" font-size="9" fill="#A855F7">AI Summary</text>
  <text x="260" y="336" font-family="system-ui" font-size="8" fill="#ffffff50">Key findings: Elevated glucose levels, normal blood pressure...</text>
  <rect x="240" y="365" width="420" height="40" rx="8" fill="#1c1a28"/>
  <text x="260" y="385" font-family="system-ui" font-size="9" fill="#ffffff60">Risk Assessment: Low • Confidence: 94%</text>
  <!-- Input bar -->
  <rect x="240" y="490" width="480" height="36" rx="18" fill="#1c1a28" stroke="#ffffff0a" stroke-width="1"/>
  <text x="270" y="512" font-family="system-ui" font-size="9" fill="#ffffff30">Ask a question about your documents...</text>
  <circle cx="700" cy="508" r="14" fill="#A855F7" opacity="0.2"/>
</svg>
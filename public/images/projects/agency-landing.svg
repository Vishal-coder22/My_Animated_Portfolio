<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0e08"/>
      <stop offset="100%" stop-color="#0c0b06"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="250" rx="280" ry="180" fill="#F59E0B" opacity="0.04"/>
  <!-- Browser chrome -->
  <rect x="40" y="30" width="720" height="540" rx="12" fill="#111118" stroke="#ffffff0d" stroke-width="1"/>
  <rect x="40" y="30" width="720" height="36" rx="12" fill="#16161f"/>
  <rect x="40" y="54" width="720" height="12" fill="#16161f"/>
  <circle cx="62" cy="48" r="5" fill="#ff5f57"/><circle cx="80" cy="48" r="5" fill="#febc2e"/><circle cx="98" cy="48" r="5" fill="#28c840"/>
  <rect x="200" y="41" width="400" height="14" rx="7" fill="#ffffff08"/>
  <text x="400" y="52" text-anchor="middle" font-family="system-ui" font-size="8" fill="#ffffff40">apex-agency.com</text>
  <!-- Nav -->
  <rect x="40" y="66" width="720" height="40" fill="#0f0e08" opacity="0.9"/>
  <text x="75" y="90" font-family="system-ui" font-size="11" font-weight="700" fill="#F59E0B">APEX</text>
  <text x="120" y="90" font-family="system-ui" font-size="11" font-weight="300" fill="#ffffff80">agency</text>
  <text x="550" y="90" font-family="system-ui" font-size="9" fill="#ffffff50">Work</text>
  <text x="600" y="90" font-family="system-ui" font-size="9" fill="#ffffff50">Services</text>
  <text x="660" y="90" font-family="system-ui" font-size="9" fill="#ffffff50">About</text>
  <text x="710" y="90" font-family="system-ui" font-size="9" fill="#F59E0B">Contact</text>
  <!-- Bold hero text -->
  <text x="100" y="180" font-family="system-ui" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-2">WE</text>
  <text x="100" y="230" font-family="system-ui" font-size="48" font-weight="900" fill="#F59E0B" letter-spacing="-2">CREATE</text>
  <text x="100" y="275" font-family="system-ui" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-2">DIGITAL</text>
  <text x="100" y="320" font-family="system-ui" font-size="16" fill="#ffffff40" font-weight="300">Award-winning design studio for brands that matter.</text>

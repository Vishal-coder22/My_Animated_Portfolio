    <rect x="15" y="15" width="30" height="30" rx="6" fill="#F59E0B" opacity="0.15"/>
    <text x="30" y="35" text-anchor="middle" font-family="system-ui" font-size="14">🎨</text>
    <text x="55" y="28" font-family="system-ui" font-size="10" font-weight="600" fill="#ffffff">Brand Identity</text>
    <text x="55" y="42" font-family="system-ui" font-size="8" fill="#ffffff40">Logo, guidelines, assets</text>
  </g>
  <g transform="translate(310, 360)">
    <rect width="180" height="90" rx="8" fill="#16161f" stroke="#F59E0B15" stroke-width="1"/>
    <rect x="15" y="15" width="30" height="30" rx="6" fill="#F59E0B" opacity="0.15"/>
    <text x="30" y="35" text-anchor="middle" font-family="system-ui" font-size="14">💻</text>
    <text x="55" y="28" font-family="system-ui" font-size="10" font-weight="600" fill="#ffffff">Web Design</text>
    <text x="55" y="42" font-family="system-ui" font-size="8" fill="#ffffff40">Responsive, modern UI</text>
  </g>
  <g transform="translate(520, 360)">

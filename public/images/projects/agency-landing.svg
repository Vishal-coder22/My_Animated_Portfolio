  <text x="130" y="508" font-family="Georgia, serif" font-size="11" fill="#ffffff60" font-style="italic">"Apex transformed our brand beyond what we imagined."</text>
  <text x="130" y="525" font-family="system-ui" font-size="8" fill="#F59E0B80">— Sarah Chen, CEO at TechFlow</text>
